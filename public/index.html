<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spotifake</title>
    <meta name="description" content="Médiathèque audio partagée en pair-à-pair" />
    <meta name="theme-color" content="#08090d" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
      <main class="main" id="main" tabindex="-1"></main>
      <footer class="player" id="player" aria-label="Lecteur"></footer>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div id="overlay-root"></div>

    <noscript>Spotifake a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
